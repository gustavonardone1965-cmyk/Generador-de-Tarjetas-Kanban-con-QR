<style>
:root{--bg:#F3F5F7;--card:#FFFFFF;--ink:#14202B;--muted:#5B6773;--line:#DDE3E8;--band:#1B3A5C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F161C;--card:#18222B;--ink:#EEF2F5;--muted:#9AA6B2;--line:#2A3742;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
.estado{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin:4px 2px 12px}
.punto{width:9px;height:9px;border-radius:50%;background:#9AA6B2;flex:none}
.punto.vivo{background:#1F8A5B}.punto.cache{background:#D69E2E}.punto.base{background:#8A94A6}
.ficha{background:var(--card);border:2px solid var(--band);border-radius:14px;overflow:hidden}
.banda{background:var(--band);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.banda h2{margin:0;font-size:16px}
.abc{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:800;font-size:18px;letter-spacing:.06em}
.cuerpo{padding:16px}
.sku{font-weight:800;font-size:14px;color:var(--muted)}
h1{font-size:26px;line-height:1.15;margin:4px 0 14px}
dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:9px 14px;margin:0;border-top:1px solid var(--line);padding-top:14px}
dt{color:var(--muted);font-size:14px}
dd{margin:0;font-weight:600;overflow-wrap:anywhere}
dd.vacio{color:var(--muted);font-weight:400}
.pie{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.aviso h1{font-size:20px;margin-bottom:6px}
</style>
</head>

<script>
/* ===== Configuración común (ficha y generador) ===== */
const CONFIG = {
  SHEET_ID: "1AUbpq642GAyHYlp73SC0_cWWW75YPEjfENygWnTttuA",
  URL_FICHA: "https://gustavonardone1965-cmyk.github.io/Generador-de-Tarjetas-Kanban-con-QR/index.html",
  CAMPO_SKU: "SKU",
  CAMPO_PRODUCTO: "Producto",
  CAMPO_REGION: "Region_Estrategica",
  CAMPO_ABC: "ABC_Combinado",
  CAMPO_ESTRATEGIA: "Estrategia_Gestion"
};
const REGIONES = {
  "Críticos (AAA)":           { titulo: "Críticos (AAA)",           color: "#1F8A5B" },
  "Estratégicos Financieros": { titulo: "Estratégicos financieros", color: "#2B6CB0" },
  "Cuellos de Botella":       { titulo: "Cuellos de botella",       color: "#C0392B" },
  "Rutina":                   { titulo: "Rutina",                   color: "#6B7280" },
  "ND":                       { titulo: "Sin región (ND)",          color: "#8A94A6" }
};
const COLOR_NEUTRO = "#1B3A5C";
function regionDe(it){
  const v = String(it[CONFIG.CAMPO_REGION] ?? "").trim();
  return REGIONES[v] || { titulo: v || "Sin región", color: "#8A94A6" };
}
function skuTxt(v){ const s=String(v ?? "").trim(); if(s==="") return ""; return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s,10)) : s; }
function etiquetaCampo(c){ return String(c).replace(/_/g," "); }
function limpiarTitulo(c){ return String(c ?? "").replace(/^\uFEFF/,"").trim(); }

/* Lee la primera pestaña de la Google Sheet (JSONP de gviz: no depende de CORS).
   Devuelve { campos:[títulos en orden], filas:[{campo:valor texto}] }. */
function cargarSheet(sheetId, timeoutMs){
  return new Promise((resolve,reject)=>{
    if(!sheetId){ reject(new Error("Falta el ID de la Google Sheet")); return; }
    const cb="__gviz_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");
    const t=setTimeout(()=>{ fin(); reject(new Error("La Google Sheet no respondió (sin conexión o sin acceso público)")); }, timeoutMs||9000);
    function fin(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); }
    window[cb]=(resp)=>{
      fin();
      if(!resp || resp.status==="error"){ reject(new Error("La Google Sheet no está compartida como «Cualquier persona con el enlace · Lector»")); return; }
      const campos=resp.table.cols.map(c=>limpiarTitulo(c.label));
      const filas=resp.table.rows.map(r=>{
        const o={};
        campos.forEach((c,i)=>{
          const cel=r.c[i];
          let v="";
          if(cel && cel.v!=null){ v = (typeof cel.v==="number") ? (cel.f!=null ? String(cel.f) : String(cel.v)) : String(cel.v); }
          o[c]=v.trim();
        });
        return o;
      }).filter(f=>campos.some(c=>f[c]!==""));
      resolve({campos:campos.filter(c=>c!==""), filas});
    };
    s.onerror=()=>{ fin(); reject(new Error("No se pudo contactar a Google Sheets")); };
    s.src="https://docs.google.com/spreadsheets/d/"+encodeURIComponent(sheetId)+"/gviz/tq?headers=1&tqx=responseHandler:"+cb;
    document.head.appendChild(s);
  });
}

/* Auditoría de la base: devuelve lista de {nivel:'error'|'aviso', texto} */
function auditarBase(campos, filas){
  const out=[], K=CONFIG;
  [K.CAMPO_SKU,K.CAMPO_PRODUCTO].forEach(c=>{ if(!campos.includes(c)) out.push({nivel:"error",texto:"Falta la columna «"+c+"» en la fila 1. Sin ella el sistema no funciona."}); });
  if(out.length) return out;
  const vistos={};
  filas.forEach((f,i)=>{
    const fila=i+2, sku=skuTxt(f[K.CAMPO_SKU]), nom=f[K.CAMPO_PRODUCTO]||"(sin nombre)";
    if(sku===""){ out.push({nivel:"aviso",texto:"Fila "+fila+": «"+nom+"» no tiene SKU; no se genera etiqueta."}); }
    else {
      if(!/^\d+$/.test(sku)) out.push({nivel:"error",texto:"Fila "+fila+": SKU «"+sku+"» no es numérico."});
      if(sku==="0") out.push({nivel:"aviso",texto:"Fila "+fila+": «"+nom+"» tiene SKU 0; parece un código provisorio. Reemplazalo por el código real antes de imprimir."});
      if(vistos[sku]) out.push({nivel:"error",texto:"SKU "+sku+" repetido en las filas "+vistos[sku]+" y "+fila+". Un QR no puede apuntar a dos productos."});
      else vistos[sku]=fila;
    }
    campos.forEach(c=>{
      const v=f[c]||"";
      if(/[ÃÂ]|\uFFFD/.test(v)) out.push({nivel:"error",texto:"Fila "+fila+", columna "+c+": caracteres mal codificados («"+v.slice(0,40)+"»). Volvé a importar el CSV en UTF-8."});
      if(/^\d{1,2}-(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic|jan|apr|aug|dec)\.?$/i.test(v) || /(^|\D)4\d{4}(\D|$)/.test(v) && /rack|nivel|posici|ubicaci/i.test(c))
        out.push({nivel:"error",texto:"Fila "+fila+", columna "+c+": «"+v+"» parece un valor convertido en fecha por Excel o Sheets."});
    });
    const reg=f[K.CAMPO_REGION];
    if(campos.includes(K.CAMPO_REGION) && reg && !REGIONES[reg]) out.push({nivel:"aviso",texto:"Fila "+fila+": región «"+reg+"» no es una de las cinco válidas; se muestra en gris."});
  });
  return out;
}

<script>
const sku = new URLSearchParams(location.search).get("sku") || "";
const $app=document.getElementById("app"), $estado=document.getElementById("estado");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function estado(tipo,texto){ $estado.innerHTML='<span class="punto '+tipo+'"></span><span>'+esc(texto)+'</span>'; }
function mostrar(base){
  const K=CONFIG;
  if(!sku){ $app.innerHTML='<div class="aviso"><h1>Falta el código del producto</h1><p>Escaneá el QR de una etiqueta para ver la ficha.</p></div>'; return; }
  const it = base.filas.find(x=>skuTxt(x[K.CAMPO_SKU])===skuTxt(sku));
  if(!it){ $app.innerHTML='<div class="aviso"><h1>SKU '+esc(sku)+' no está en la base</h1><p>Revisá que el producto siga cargado en la Google Sheet con ese mismo código.</p></div>'; return; }
  const r=regionDe(it); document.documentElement.style.setProperty("--band",r.color);
  document.title = (it[K.CAMPO_PRODUCTO]||"Producto")+" · SKU "+skuTxt(it[K.CAMPO_SKU]);
  const resto = base.campos.filter(c=>c!==K.CAMPO_SKU && c!==K.CAMPO_PRODUCTO);
  const filas = resto.map(c=>{ const v=it[c]; return '<dt>'+esc(etiquetaCampo(c))+'</dt>'+(v!==""&&v!=null?'<dd>'+esc(v)+'</dd>':'<dd class="vacio">sin dato</dd>'); }).join("");
  const abc = it[K.CAMPO_ABC] ? '<span class="abc">'+esc(it[K.CAMPO_ABC])+'</span>' : "";
  $app.innerHTML='<article class="ficha"><div class="banda"><h2>'+esc(r.titulo)+'</h2>'+abc+'</div>'+
    '<div class="cuerpo"><div class="sku">SKU '+esc(skuTxt(it[K.CAMPO_SKU]))+'</div><h1>'+esc(it[K.CAMPO_PRODUCTO]||"")+'</h1>'+
    '<dl>'+filas+'</dl></div></article><div class="pie">Consultnet · Programa Lean Grido</div>';
}
function cache(){ try{ const c=JSON.parse(localStorage.getItem("grido_qr_cache_v2")||"null"); return c&&c.base&&Array.isArray(c.base.filas)?c:null; }catch(e){ return null; } }
(async()=>{
  const fmt=d=>new Date(d).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"});
  if(!CONFIG.SHEET_ID){ estado("base","Copia base ("+FECHA_COPIA_BASE+") · falta conectar la Google Sheet"); mostrar(COPIA_BASE); return; }
  try{
    const base=await cargarSheet(CONFIG.SHEET_ID,9000);
    try{ localStorage.setItem("grido_qr_cache_v2",JSON.stringify({ts:Date.now(),base})); }catch(e){}
    estado("vivo","Datos en vivo · "+fmt(Date.now()));
    mostrar(base);
  }catch(err){
    const c=cache();
    if(c){ estado("cache","Sin conexión · última copia del "+fmt(c.ts)); mostrar(c.base); }
    else { estado("base",err.message+" · se muestra la copia base ("+FECHA_COPIA_BASE+")"); mostrar(COPIA_BASE); }
  }
})();
</script>
