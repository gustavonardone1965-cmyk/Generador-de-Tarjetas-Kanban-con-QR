<title>Ficha de producto · Grido</title>
<style>
:root{--bg:#F3F5F7;--card:#FFFFFF;--ink:#14202B;--muted:#5B6773;--line:#DDE3E8;--band:#1F8A5B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F161C;--card:#18222B;--ink:#EEF2F5;--muted:#9AA6B2;--line:#2A3742;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
.estado{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin:4px 2px 12px}
.punto{width:9px;height:9px;border-radius:50%;background:#9AA6B2;flex:none}
.punto.vivo{background:#1F8A5B}.punto.cache{background:#D69E2E}.punto.base{background:#8A94A6}
.ficha{background:var(--card);border:2px solid var(--band);border-radius:14px;overflow:hidden}
.banda{background:var(--band);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.banda h2{margin:0;font-size:15px;letter-spacing:.04em}
.abc{min-width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800;font-size:22px}
.cuerpo{padding:16px}
.sku{font-weight:800;font-size:14px;color:var(--muted)}
h1{font-size:26px;line-height:1.15;margin:4px 0 6px}
.cat{color:var(--muted);font-size:14px;margin-bottom:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:0;border-top:1px solid var(--line);padding-top:14px}
dt{color:var(--muted);font-size:14px}
dd{margin:0;font-weight:600}
.estrategia{margin-top:14px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--band) 12%,transparent);font-weight:600}
.pie{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.aviso h1{font-size:20px}
</style>
</head>

<script>
/* ---- Lógica compartida: lectura de Google Sheet (JSONP gviz) y estilos por región ---- */
const REGIONES = {
  "Críticos (AAA)":           { titulo: "CRÍTICOS (AAA)",          color: "#1F8A5B" },
  "Estratégicos Financieros": { titulo: "ESTRATÉGICOS FINANCIEROS", color: "#2B6CB0" },
  "Cuellos de Botella":       { titulo: "CUELLOS DE BOTELLA",       color: "#C0392B" },
  "Rutina":                   { titulo: "RUTINA",                   color: "#6B7280" },
  "ND":                       { titulo: "GASTO CONSUMIBLE",         color: "#8A94A6" }
};
function regionDe(item){ return REGIONES[item.Region_Estrategica] || { titulo: (item.Region_Estrategica||"SIN REGIÓN").toUpperCase(), color:"#8A94A6" }; }
function letraABC(item){ const v=String(item.ABC_Facturacion||"").trim(); return /^[ABC]$/.test(v)?v:"–"; }
function skuTxt(v){ if(v===null||v===undefined||v==="") return ""; const n=Number(v); return Number.isFinite(n)?String(Math.round(n)):String(v).trim(); }

function cargarSheet(sheetId, timeoutMs){
  return new Promise((resolve,reject)=>{
    if(!sheetId){ reject(new Error("Falta el ID de la Google Sheet")); return; }
    const cb="__gviz_"+Date.now();
    const s=document.createElement("script");
    const t=setTimeout(()=>{ limpiar(); reject(new Error("La Google Sheet no respondió (sin conexión o sin acceso público)")); }, timeoutMs||9000);
    function limpiar(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); }
    window[cb]=(resp)=>{
      limpiar();
      if(!resp || resp.status==="error"){ reject(new Error("La Google Sheet no está compartida como 'Cualquier persona con el enlace · Lector'")); return; }
      const cols=resp.table.cols.map(c=>(c.label||"").trim());
      const filas=resp.table.rows.map(r=>{ const o={}; cols.forEach((c,i)=>{ const cel=r.c[i]; o[c]= cel==null ? "" : (cel.v==null ? "" : cel.v); }); return o; });
      resolve(filas.filter(f=>String(f.Producto||"").trim()!==""));
    };
    s.onerror=()=>{ limpiar(); reject(new Error("No se pudo contactar a Google Sheets")); };
    s.src="https://docs.google.com/spreadsheets/d/"+encodeURIComponent(sheetId)+"/gviz/tq?headers=1&tqx=responseHandler:"+cb;
    document.head.appendChild(s);
  });
}

</script>
<script>
const sku = new URLSearchParams(location.search).get("sku") || "";
const $app=document.getElementById("app"), $estado=document.getElementById("estado");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function estado(tipo,texto){ $estado.innerHTML='<span class="punto '+tipo+'"></span><span>'+esc(texto)+'</span>'; }
function mostrar(lista){
  const it = lista.find(x=>skuTxt(x.SKU)===skuTxt(sku));
  if(!sku){ $app.innerHTML='<div class="aviso"><h1>Falta el código del producto</h1><p>Escaneá el QR de una etiqueta para ver la ficha.</p></div>'; return; }
  if(!it){ $app.innerHTML='<div class="aviso"><h1>SKU '+esc(sku)+' no está en la base</h1><p>Revisá que el producto siga cargado en la Google Sheet con ese mismo código.</p></div>'; return; }
  const r=regionDe(it); document.documentElement.style.setProperty("--band",r.color);
  document.title = it.Producto+" · SKU "+skuTxt(it.SKU);
  const fila=(k,v)=> v!==""&&v!=null ? '<dt>'+k+'</dt><dd>'+esc(v)+'</dd>' : "";
  $app.innerHTML=
   '<article class="ficha"><div class="banda"><h2>'+esc(r.titulo)+'</h2><div class="abc" title="ABC por facturación">'+esc(letraABC(it))+'</div></div>'+
   '<div class="cuerpo"><div class="sku">SKU '+esc(skuTxt(it.SKU))+'</div><h1>'+esc(it.Producto)+'</h1><div class="cat">'+esc(it.Categoria)+'</div>'+
   '<dl>'+fila("Unidad",it.Unidad_Empaque)+fila("ABC ($)",it.ABC_Facturacion)+fila("ABC (Kg)",it.ABC_Kg)+fila("ABC (kWh/m³)",it.ABC_Energia)+
   fila("Ubicación",it.Ubicacion_Rack)+fila("Cadena de frío",it.Cadena_Frio)+fila("Franquicia",it.Franquicia)+'</dl>'+
   (it.Estrategia_Gestion?'<div class="estrategia">'+esc(it.Estrategia_Gestion)+'</div>':"")+
   '</div></article><div class="pie">Consultnet · Programa Lean Grido</div>';
}
function cache(){ try{ const c=JSON.parse(localStorage.getItem("grido_qr_cache")||"null"); return c&&Array.isArray(c.filas)?c:null; }catch(e){ return null; } }
(async()=>{
  if(!SHEET_ID){ estado("base","Copia base del Excel ("+FECHA_COPIA_BASE+") · falta conectar la Google Sheet"); mostrar(COPIA_BASE); return; }
  try{
    const filas=await cargarSheet(SHEET_ID,9000);
    try{ localStorage.setItem("grido_qr_cache",JSON.stringify({ts:Date.now(),filas})); }catch(e){}
    estado("vivo","Datos en vivo · "+new Date().toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}));
    mostrar(filas);
  }catch(err){
    const c=cache();
    if(c){ estado("cache","Sin conexión · última copia del "+new Date(c.ts).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})); mostrar(c.filas); }
    else { estado("base",err.message+" · se muestra la copia base ("+FECHA_COPIA_BASE+")"); mostrar(COPIA_BASE); }
  }
})();
</script>
